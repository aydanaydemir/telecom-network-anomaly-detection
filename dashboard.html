<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Operations Center - Health Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            padding: 40px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #27293d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #e1e1e1;
            border-bottom: 2px solid #3b3b53;
            padding-bottom: 15px;
            margin-top: 0;
        }
        .metric-box {
            background-color: #32325d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
        }
        .metric-label {
            color: #a4a6b3;
            font-weight: bold;
        }
        .status-critical {
            color: #ff5d5d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-normal {
            color: #00f2c3;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #8b8b99;
            text-align: right;
            border-top: 1px solid #3b3b53;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cellular Network Operations Health Monitor</h2>
        
        <div class="metric-box">
            <span class="metric-label">Last Telemetry Timestamp:</span>
            <span>2026-10-12 21:16:52</span>
        </div>
        
        <div class="metric-box">
            <span class="metric-label">Network Status Assessment:</span> 
            <span class="status-critical">Critical</span>
        </div>
        
        <div class="metric-box">
            <span class="metric-label">Signal Quality (SNR):</span>
            <span>8.5 dB</span>
        </div>

        <div class="metric-box">
            <span class="metric-label">Connected Subscribers:</span>
            <span>450</span>
        </div>

        <div class="metric-box">
            <span class="metric-label">Radio Latency:</span>
            <span>65.0 ms</span>
        </div>
        
        <div class="footer">Automated Telemetry Fault Classification Pipeline</div>
    </div>
</body>
</html>
